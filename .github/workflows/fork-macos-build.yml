name: Fork macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build. Leave blank to use the current branch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      - name: Install mobile dependencies
        uses: ./.github/actions/install-mobile-dependencies

      - name: Build macOS package
        run: pnpm run build:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-macos-${{ github.run_id }}
          path: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.app
          if-no-files-found: error
          retention-days: 7
